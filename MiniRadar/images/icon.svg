<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18283F"/>
      <stop offset="1" stop-color="#0A111C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4DA6FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4DA6FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="256" y1="256" x2="256" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#63B5FF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#63B5FF" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="shadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#4DA6FF" stroke-opacity="0.25" stroke-width="4"/>
  <circle cx="256" cy="256" r="250" fill="url(#glow)"/>

  <!-- Balayage du radar -->
  <path d="M256 256 L256 72 A184 184 0 0 1 386 126 Z" fill="url(#sweep)"/>

  <!-- Cercles de la minimap -->
  <g fill="none" stroke="#FFFFFF">
    <circle cx="256" cy="256" r="184" stroke-opacity="0.85" stroke-width="10"/>
    <circle cx="256" cy="256" r="122" stroke-opacity="0.22" stroke-width="6"/>
    <circle cx="256" cy="256" r="60" stroke-opacity="0.22" stroke-width="6"/>
  </g>

  <!-- Toi au centre, et les joueurs autour -->
  <g filter="url(#shadow)">
    <circle cx="256" cy="256" r="17" fill="#FFFFFF"/>
    <circle cx="338" cy="176" r="24" fill="#FFB02E"/>
    <circle cx="150" cy="212" r="24" fill="#48E08A"/>
    <circle cx="316" cy="356" r="24" fill="#63B5FF"/>
  </g>
</svg>
